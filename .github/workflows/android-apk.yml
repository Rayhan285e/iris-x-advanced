name: Build IRIS NOVA Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps
      - name: Verify Expo configuration
        run: npx expo config --type public
      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v -storetype JKS \
            -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Copy APK with friendly name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/IRIS-NOVA-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iris-nova-debug-apk
          path: android/app/build/outputs/apk/debug/IRIS-NOVA-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: IRIS NOVA Latest Build
          body: |
            Auto-built debug APK for IRIS NOVA.

            Direct download link:
            https://github.com/Rayhan285e/iris-x-advanced/releases/latest/download/IRIS-NOVA-debug.apk

            Install on Android, allow "Install unknown apps", then add your Gemini API key in Settings.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
